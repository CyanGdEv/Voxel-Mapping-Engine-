name: Build Minecraft Theme Park World (Resilient)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select the theme park to generate
        required: true
        default: alton-towers
        type: choice
        options:
          - alton-towers
          - chessington
          - thorpe-park

permissions:
  contents: read

concurrency:
  group: themepark-world-resilient-${{ github.ref }}-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  build-world:
    name: Generate resilient automatic Bedrock world
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_PRESET: ${{ inputs.preset }}
      TPMAP_PARK_NAME: ""
      TPMAP_BBOX: ""
      TPMAP_ACCURACY: benchmark
      TPMAP_WORLD_MARGIN: "32"
      TPMAP_ENGLAND_OPEN_DATA: "true"
      TPMAP_PLANNING_DOCUMENT_MODE: extract
      TPMAP_PLANNING_DOCUMENT_MAX_APPLICATIONS: "300"
      TPMAP_PLANNING_DOCUMENT_MAX_DOCUMENTS: "1200"
      TPMAP_PLANNING_DOCUMENT_MAX_MB: "150"
      TPMAP_PLANNING_DOCUMENT_MAX_PAGES: "12"
      TPMAP_PLANNING_DOCUMENT_MIN_SCORE: "25"
      TPMAP_PLANNING_DOCUMENT_LICENSE: ""
      TPMAP_PLANNING_PREFETCH_DIR: ${{ github.workspace }}/planning-prefetch-selected
      TPMAP_PLANNING_OVERRIDE_MODE: gated
      TPMAP_PLANNING_GEOMETRY_PATH: ""
      TPMAP_PLANNING_OVERRIDE_MIN_CONFIDENCE: "0.86"
      TPMAP_PLANNING_OVERRIDE_MIN_OVERLAP: "0.18"
      TPMAP_PLANNING_OVERRIDE_MAX_OFFSET_M: "25"
      TPMAP_MICROSOFT_BUILDINGS: "true"
      TPMAP_WIKIDATA_PLACES: "true"
      TPMAP_WIKIMEDIA_COMMONS: "false"
      TPMAP_OPEN_AERIAL_MAP: "true"
      TPMAP_STRICT_SUPPLEMENTAL_SOURCES: "false"
      TPMAP_SOURCE_CONFIG_PATH: ""
      TPMAP_OS_OPENMAP_LOCAL_PATH: ""
      TPMAP_ORTHOPHOTO_URL: ""
      TPMAP_ORTHOPHOTO_SOURCE: ""
      TPMAP_ORTHOPHOTO_LICENSE: ""
      TPMAP_ORTHOPHOTO_DATE: ""
      TPMAP_ORTHOPHOTO_SHA256: ""
      TPMAP_MAX_SUPPLEMENTAL_FEATURES: "50000"
      TPMAP_SUPPLEMENTAL_PAGE_SIZE: "5000"
      TPMAP_MAX_SUPPLEMENTAL_DOWNLOAD_MB: "250"
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install build and automatic-registration tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin unzip poppler-utils python3-opencv wget ca-certificates
          python3 -c 'import cv2; print("opencv=" + cv2.__version__)'

      - name: Validate planning clients
        if: ${{ inputs.preset == 'alton-towers' }}
        continue-on-error: true
        shell: bash
        run: |
          node scripts/prefetch-planning-portal-http.mjs --self-test
          node scripts/complete-planning-prefetch-attachments.mjs --self-test
          node scripts/complete-planning-prefetch-balanced.mjs --self-test
          node scripts/prefetch-planning-portal-browser.mjs --self-test
          node scripts/prefetch-planning-portal.mjs --self-test

      - name: Discover official planning evidence with bounded fallbacks
        if: ${{ inputs.preset == 'alton-towers' }}
        continue-on-error: true
        shell: bash
        run: |
          rm -rf planning-prefetch-output
          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            node scripts/prefetch-planning-portal-browser.mjs \
              --output planning-prefetch-output \
              --runner linux-resilient-expanded \
              --max-applications 300 \
              --max-documents 1200 \
              --max-mb 150
          expanded_status=$?
          set -e

          usable=false
          if [[ -f planning-prefetch-output/manifest.json ]]; then
            node -e "const m=require('./planning-prefetch-output/manifest.json'); process.exit(m.status === 'usable' ? 0 : 1)" \
              && usable=true || true
          fi

          if [[ "$usable" != "true" ]]; then
            echo "::warning::Expanded planning discovery did not produce usable evidence (exit $expanded_status); trying the bounded legacy fallback."
            rm -rf planning-prefetch-output
            set +e
            timeout --signal=TERM --kill-after=30s 15m \
              node scripts/prefetch-planning-portal.mjs \
                --output planning-prefetch-output \
                --runner linux-resilient-fallback \
                --max-applications 300 \
                --max-documents 1200 \
                --max-mb 150
            fallback_status=$?
            set -e
            echo "legacy_fallback_exit=$fallback_status"
          fi

      - name: Prepare planning evidence or safe no-planning fallback
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const source = path.resolve('planning-prefetch-output');
          const target = path.resolve('planning-prefetch-selected');
          fs.rmSync(target, { recursive: true, force: true });

          let usable = false;
          let manifest = null;
          try {
            manifest = JSON.parse(fs.readFileSync(path.join(source, 'manifest.json'), 'utf8'));
            usable = manifest?.status === 'usable'
              && Number(manifest?.liveApplications || 0) > 0
              && Number(manifest?.documentsDownloaded || 0) > 0;
          } catch {
            usable = false;
          }

          if (usable) {
            fs.cpSync(source, target, { recursive: true });
            console.log(JSON.stringify({
              planningMode: 'usable',
              runner: manifest.runner || 'unknown',
              applications: manifest.liveApplications || 0,
              documents: manifest.documentsDownloaded || 0
            }));
          } else {
            fs.mkdirSync(target, { recursive: true });
            const fallback = {
              schemaVersion: 1,
              status: 'disabled',
              generatedAt: new Date().toISOString(),
              runner: 'resilient-no-planning-fallback',
              tlsVerification: null,
              liveApplications: 0,
              documentsDownloaded: 0,
              totalBytes: 0,
              applications: [],
              entries: [],
              attempts: [],
              warnings: [
                'Official planning evidence was unavailable for this run. World generation continued with the remaining geospatial sources.'
              ]
            };
            fs.writeFileSync(path.join(target, 'manifest.json'), JSON.stringify(fallback, null, 2));
            console.log(JSON.stringify({ planningMode: 'fallback', applications: 0, documents: 0 }));
          }
          NODE

      - name: Upload planning acquisition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-prefetch-resilient-diagnostics
          path: |
            planning-prefetch-output/**
            planning-prefetch-selected/**
          if-no-files-found: warn
          retention-days: 14

      - name: Generate and validate world
        id: build
        shell: bash
        run: |
          cat scripts/build-themepark-world-v0120-direct.sh.part-* > "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          chmod +x "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          bash "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"

      - name: Write build summary
        if: always()
        shell: bash
        env:
          SUMMARY_PRESET: ${{ inputs.preset }}
          SUMMARY_STRATEGY: ${{ steps.build.outputs.strategy || 'none' }}
          SUMMARY_MCWORLD: ${{ steps.build.outputs.mcworld || '' }}
        run: |
          {
            printf '%s\n' '# Voxel Mapping Engine — Resilient Automatic Theme Park World'
            printf '\n'
            printf '%s\n' "- Park: ${SUMMARY_PRESET:-unknown}"
            printf '%s\n' '- Player inputs: park selection only'
            printf '%s\n' '- Planning failure policy: fail closed for planning geometry, continue world generation with remaining sources'
            printf '%s\n' "- Successful strategy: ${SUMMARY_STRATEGY:-none}"
            if [[ -f "$TPMAP_PLANNING_PREFETCH_DIR/manifest.json" ]]; then
              node -e 'const m=require(process.argv[1]); console.log(`- Planning evidence status: ${m.status||"unknown"}; ${m.liveApplications||0} applications; ${m.documentsDownloaded||0} documents; runner ${m.runner||"unknown"}`)' "$TPMAP_PLANNING_PREFETCH_DIR/manifest.json"
            fi
            if [[ -n "$SUMMARY_MCWORLD" && -f "$SUMMARY_MCWORLD" ]]; then
              printf '\n%s\n' '## Generated world'
              printf '%s\n' "- File: $(basename "$SUMMARY_MCWORLD")"
              printf '%s\n' "- Size: $(du -h "$SUMMARY_MCWORLD" | cut -f1)"
              printf '%s\n' "- SHA-256: $(sha256sum "$SUMMARY_MCWORLD" | cut -d' ' -f1)"
            else
              printf '\n%s\n' '## Build did not produce a world'
              printf '%s\n' 'See the diagnostics artifact for the exact failing stage.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated world and reports
        if: ${{ always() && steps.build.outputs.mcworld != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.safe_name }}-mcworld-v0120
          path: generator/out/github-actions/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-v0120-resilient-build-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

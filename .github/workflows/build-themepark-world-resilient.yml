name: Build Minecraft Theme Park World (Resilient)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select the theme park to generate
        required: true
        default: alton-towers
        type: choice
        options:
          - alton-towers
          - chessington
          - thorpe-park

permissions:
  contents: read

concurrency:
  group: themepark-world-resilient-${{ github.ref }}-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  build-world:
    name: Generate resilient automatic Bedrock world
    runs-on: ubuntu-24.04
    # Product requirement: a one-click generation run must never consume hours.
    # The direct runner has its own 34-minute world budget; this is the final
    # workflow-level safety boundary including cache/setup/artifact work.
    timeout-minutes: 40
    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_PRESET: ${{ inputs.preset }}
      TPMAP_PARK_NAME: ""
      TPMAP_BBOX: ""
      TPMAP_ACCURACY: benchmark
      TPMAP_WORLD_MARGIN: "32"
      TPMAP_ENGLAND_OPEN_DATA: "true"
      TPMAP_PLANNING_DOCUMENT_MODE: extract
      TPMAP_PLANNING_DOCUMENT_MAX_APPLICATIONS: "500"
      TPMAP_PLANNING_DOCUMENT_MAX_DOCUMENTS: "1200"
      TPMAP_PLANNING_DOCUMENT_MAX_MB: "150"
      TPMAP_PLANNING_DOCUMENT_MAX_PAGES: "12"
      TPMAP_PLANNING_DOCUMENT_MIN_SCORE: "25"
      TPMAP_PLANNING_DOCUMENT_LICENSE: ""
      TPMAP_PLANNING_PREFETCH_DIR: ${{ github.workspace }}/planning-prefetch-selected
      TPMAP_PLANNING_OVERRIDE_MODE: gated
      TPMAP_PLANNING_GEOMETRY_PATH: ""
      TPMAP_PLANNING_OVERRIDE_MIN_CONFIDENCE: "0.86"
      TPMAP_PLANNING_OVERRIDE_MIN_OVERLAP: "0.18"
      TPMAP_PLANNING_OVERRIDE_MAX_OFFSET_M: "25"
      TPMAP_MICROSOFT_BUILDINGS: "true"
      TPMAP_WIKIDATA_PLACES: "true"
      TPMAP_WIKIMEDIA_COMMONS: "false"
      TPMAP_OPEN_AERIAL_MAP: "true"
      TPMAP_STRICT_SUPPLEMENTAL_SOURCES: "false"
      TPMAP_SOURCE_CONFIG_PATH: ""
      TPMAP_OS_OPENMAP_LOCAL_PATH: ""
      TPMAP_ORTHOPHOTO_URL: ""
      TPMAP_ORTHOPHOTO_SOURCE: ""
      TPMAP_ORTHOPHOTO_LICENSE: ""
      TPMAP_ORTHOPHOTO_DATE: ""
      TPMAP_ORTHOPHOTO_SHA256: ""
      TPMAP_MAX_SUPPLEMENTAL_FEATURES: "50000"
      TPMAP_SUPPLEMENTAL_PAGE_SIZE: "500"
      TPMAP_MAX_SUPPLEMENTAL_DOWNLOAD_MB: "250"
      TPMAP_SHARED_CACHE_DIR: ${{ github.workspace }}/.park-runtime-cache/${{ inputs.preset }}/runtime
      TPMAP_WORLD_RUN_BUDGET_SECONDS: "2040"
      TPMAP_SKIP_REDUNDANT_RUNTIME_TESTS: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Restore recent shared geospatial source cache
        id: runtime_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: .park-runtime-cache/${{ inputs.preset }}/runtime
          key: park-runtime-v1-${{ inputs.preset }}-probe-${{ github.run_id }}
          restore-keys: |
            park-runtime-v1-${{ inputs.preset }}-

      - name: Validate shared geospatial source cache
        id: runtime_cache
        shell: bash
        run: |
          CACHE_DIR="$GITHUB_WORKSPACE/.park-runtime-cache/${{ inputs.preset }}/runtime"
          set +e
          node scripts/validate-park-runtime-cache.mjs \
            --input "$CACHE_DIR" \
            --park "${{ inputs.preset }}" \
            --max-age-hours 24
          cache_status=$?
          set -e
          if [[ "$cache_status" -eq 0 ]]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "source=verified-cache" >> "$GITHUB_OUTPUT"
            echo "Shared source fast path: verified cache is less than 24 hours old."
          else
            rm -rf "$CACHE_DIR"
            mkdir -p "$CACHE_DIR"
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "source=live-fill" >> "$GITHUB_OUTPUT"
            echo "Shared source cache missing, stale, or rejected; this build will refill it from authoritative providers."
          fi

      - name: Restore recent verified park evidence
        id: planning_cache_restore
        if: ${{ inputs.preset == 'alton-towers' }}
        uses: actions/cache/restore@v4
        with:
          path: .park-evidence-cache/${{ inputs.preset }}/planning
          key: park-evidence-planning-v1-${{ inputs.preset }}-probe-${{ github.run_id }}
          restore-keys: |
            park-evidence-planning-v1-${{ inputs.preset }}-

      - name: Validate restored planning evidence
        id: planning_cache
        if: ${{ inputs.preset == 'alton-towers' }}
        shell: bash
        run: |
          CACHE_DIR="$GITHUB_WORKSPACE/.park-evidence-cache/${{ inputs.preset }}/planning"
          rm -rf planning-prefetch-selected
          set +e
          node scripts/validate-planning-evidence-cache.mjs \
            --input "$CACHE_DIR" \
            --output planning-prefetch-selected \
            --max-age-hours 24
          cache_status=$?
          set -e
          if [[ "$cache_status" -eq 0 ]]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "source=verified-cache" >> "$GITHUB_OUTPUT"
            echo "Planning fast path: using a verified cache less than 24 hours old."
          else
            rm -rf planning-prefetch-selected
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "source=live-refresh" >> "$GITHUB_OUTPUT"
            echo "Planning cache missing, stale, or rejected; running a short on-demand refresh."
          fi

      - name: Install native build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin unzip poppler-utils python3-opencv wget ca-certificates
          python3 -c 'import cv2; print("opencv=" + cv2.__version__)'

      - name: Refresh planning evidence when cache is unavailable
        if: ${{ inputs.preset == 'alton-towers' && steps.planning_cache.outputs.usable != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          # The browser wrapper owns its legacy fallback and drawing-only filter.
          # Deep 500-application acquisition belongs to the evidence warmer; a
          # manual world build gets a strict four-minute opportunity to refresh
          # so planning cannot consume the world-generation budget.
          rm -rf planning-prefetch-output
          set +e
          timeout --signal=TERM --kill-after=20s 4m \
            node scripts/prefetch-planning-portal-browser.mjs \
              --output planning-prefetch-output \
              --runner linux-resilient-bounded-refresh \
              --max-applications 500 \
              --max-documents 1200 \
              --max-mb 150
          refresh_status=$?
          set -e
          echo "planning_refresh_exit=$refresh_status"

      - name: Prepare planning evidence or safe no-planning fallback
        id: planning_policy
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.planning_cache.outputs.usable }}" != "true" ]]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const source = path.resolve('planning-prefetch-output');
          const target = path.resolve('planning-prefetch-selected');
          fs.rmSync(target, { recursive: true, force: true });
          let manifest = null;
          let usable = false;
          try {
            manifest = JSON.parse(fs.readFileSync(path.join(source, 'manifest.json'), 'utf8'));
            usable = manifest?.status === 'usable'
              && Number(manifest?.liveApplications || 0) > 0
              && Number(manifest?.documentsDownloaded || 0) > 0;
          } catch {}
          if (usable) {
            fs.cpSync(source, target, { recursive: true });
            console.log(JSON.stringify({planningMode:'usable',applications:manifest.liveApplications||0,documents:manifest.documentsDownloaded||0}));
          } else {
            fs.mkdirSync(target, { recursive: true });
            fs.writeFileSync(path.join(target, 'manifest.json'), JSON.stringify({
              schemaVersion: 1,
              status: 'disabled',
              generatedAt: new Date().toISOString(),
              runner: 'resilient-no-planning-fallback',
              liveApplications: 0,
              documentsDownloaded: 0,
              totalBytes: 0,
              applications: [],
              entries: [],
              attempts: [],
              warnings: ['Planning evidence was unavailable inside the bounded build window; remaining geospatial sources continue.']
            }, null, 2));
            console.log(JSON.stringify({planningMode:'fallback',applications:0,documents:0}));
          }
          NODE
          fi

          if node -e "const m=require('./planning-prefetch-selected/manifest.json'); process.exit(m.status === 'usable' && Number(m.liveApplications||0)>0 && Number(m.documentsDownloaded||0)>0 ? 0 : 1)"; then
            echo "TPMAP_PLANNING_DOCUMENT_MODE=extract" >> "$GITHUB_ENV"
            echo "TPMAP_PLANNING_PREFETCH_DIR=$GITHUB_WORKSPACE/planning-prefetch-selected" >> "$GITHUB_ENV"
            echo "TPMAP_PLANNING_OVERRIDE_MODE=gated" >> "$GITHUB_ENV"
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "TPMAP_PLANNING_DOCUMENT_MODE=off" >> "$GITHUB_ENV"
            echo "TPMAP_PLANNING_PREFETCH_DIR=" >> "$GITHUB_ENV"
            echo "TPMAP_PLANNING_OVERRIDE_MODE=off" >> "$GITHUB_ENV"
            echo "usable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and validate world
        id: build
        shell: bash
        run: |
          cat scripts/build-themepark-world-v0120-direct.sh.part-* > "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          chmod +x "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          bash -n "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          bash "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"

      # Put the player-facing deliverable on the wire immediately after build;
      # cache and diagnostic housekeeping must not delay world availability.
      - name: Upload generated world and reports
        if: ${{ always() && steps.build.outputs.mcworld != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.safe_name }}-mcworld-v0120
          path: generator/out/github-actions/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Stage refreshed planning cache
        if: ${{ always() && inputs.preset == 'alton-towers' && steps.planning_cache.outputs.usable != 'true' && steps.planning_policy.outputs.usable == 'true' }}
        shell: bash
        run: |
          CACHE_DIR="$GITHUB_WORKSPACE/.park-evidence-cache/${{ inputs.preset }}/planning"
          rm -rf "$CACHE_DIR"
          mkdir -p "$(dirname "$CACHE_DIR")"
          cp -a planning-prefetch-selected "$CACHE_DIR"

      - name: Save refreshed planning cache
        if: ${{ always() && inputs.preset == 'alton-towers' && steps.planning_cache.outputs.usable != 'true' && steps.planning_policy.outputs.usable == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .park-evidence-cache/${{ inputs.preset }}/planning
          key: park-evidence-planning-v1-${{ inputs.preset }}-${{ github.run_id }}

      - name: Seal newly acquired shared source cache
        if: ${{ steps.build.outcome == 'success' && (steps.runtime_cache.outputs.usable != 'true' || env.TPMAP_PREPARED_GENERATOR_CREATED == 'true') }}
        shell: bash
        run: |
          rm -f "$TPMAP_SHARED_CACHE_DIR/supplemental/planning-portal-cookies.txt"
          node scripts/validate-park-runtime-cache.mjs \
            --seal \
            --input "$TPMAP_SHARED_CACHE_DIR" \
            --park "${{ inputs.preset }}"

      - name: Save verified shared source cache
        if: ${{ steps.build.outcome == 'success' && (steps.runtime_cache.outputs.usable != 'true' || env.TPMAP_PREPARED_GENERATOR_CREATED == 'true') }}
        uses: actions/cache/save@v4
        with:
          path: .park-runtime-cache/${{ inputs.preset }}/runtime
          key: park-runtime-v1-${{ inputs.preset }}-${{ github.run_id }}

      - name: Upload compact planning diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-prefetch-resilient-diagnostics
          path: |
            planning-prefetch-output/manifest.json
            planning-prefetch-output/ride-evidence-recovery.json
            planning-prefetch-selected/manifest.json
            planning-prefetch-selected/ride-evidence-recovery.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        env:
          SUMMARY_PRESET: ${{ inputs.preset }}
          SUMMARY_STRATEGY: ${{ steps.build.outputs.strategy || 'none' }}
          SUMMARY_MCWORLD: ${{ steps.build.outputs.mcworld || '' }}
          SUMMARY_PLANNING_CACHE: ${{ steps.planning_cache.outputs.source || 'not-applicable' }}
          SUMMARY_RUNTIME_CACHE: ${{ steps.runtime_cache.outputs.source || 'unknown' }}
        run: |
          {
            printf '%s\n' '# Voxel Mapping Engine — bounded resilient build'
            printf '%s\n' "- Park: ${SUMMARY_PRESET:-unknown}"
            printf '%s\n' "- Successful strategy: ${SUMMARY_STRATEGY:-none}"
            printf '%s\n' "- Planning evidence path: ${SUMMARY_PLANNING_CACHE:-unknown}"
            printf '%s\n' "- Shared geospatial cache: ${SUMMARY_RUNTIME_CACHE:-unknown}"
            printf '%s\n' '- Workflow hard limit: 40 minutes'
            printf '%s\n' '- World runner budget: 34 minutes'
            if [[ -f planning-prefetch-selected/manifest.json ]]; then
              node -e 'const m=require("./planning-prefetch-selected/manifest.json"); console.log(`- Planning: ${m.status||"unknown"}; ${m.liveApplications||0} apps; ${m.documentsDownloaded||0} docs`)'
            fi
            if [[ -n "$SUMMARY_MCWORLD" && -f "$SUMMARY_MCWORLD" ]]; then
              printf '%s\n' "- World: $(basename "$SUMMARY_MCWORLD")"
              printf '%s\n' "- SHA-256: $(sha256sum "$SUMMARY_MCWORLD" | cut -d' ' -f1)"
            else
              printf '%s\n' '- Build did not produce a world; inspect the diagnostics artifact.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-v0120-resilient-build-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

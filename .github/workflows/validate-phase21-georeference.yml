name: Validate Planning Patch Chain

on:
  push:
    branches:
      - agent/phase21-planning-drawing-georeference
      - agent/phase22-planning-vector-extraction
      - agent/phase23-gated-osm-repair
      - agent/phase24-planning-portal-resilience
      - agent/phase25-planning-tls-enforcement
  pull_request:
    paths:
      - "patches/v0120-phase20/**"
      - "patches/v0120-phase21/**"
      - "patches/v0120-phase22/**"
      - "patches/v0120-phase23/**"
      - "patches/v0120-phase24/**"
      - "patches/v0120-phase25/**"
      - "scripts/build-themepark-world-v0120-direct.sh.part-*"
      - ".github/workflows/validate-phase21-georeference.yml"

permissions:
  contents: read

jobs:
  validate-planning-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TPMAP_CONTACT: https://github.com/${{ github.repository }}
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_registry: https://registry.npmjs.org/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install geospatial validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin unzip poppler-utils curl

      - name: Assemble validation runner
        shell: bash
        run: |
          cat scripts/build-themepark-world-v0120-direct.sh.part-* > "$RUNNER_TEMP/planning-chain-validation.sh"
          python3 - "$RUNNER_TEMP/planning-chain-validation.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = '  node src/cli.mjs doctor 2>&1 | tee "$DIAG/doctor.log"\n)\n\nSOURCE_ARGS=('
          replacement = '  node src/cli.mjs doctor 2>&1 | tee "$DIAG/doctor.log"\n)\n\necho "Planning patch-chain validation complete; world generation intentionally skipped."\nexit 0\n\nSOURCE_ARGS=('
          if marker not in text:
              raise SystemExit("Could not locate the post-compatibility validation boundary")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          chmod +x "$RUNNER_TEMP/planning-chain-validation.sh"
          bash -n "$RUNNER_TEMP/planning-chain-validation.sh"

      - name: Apply patch chain and run tests
        shell: bash
        run: bash "$RUNNER_TEMP/planning-chain-validation.sh"

      - name: Upload applied planning source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-applied-source
          path: |
            generator/src/**
            generator/test/**
            generator/examples/**
            generator/*.md
            generator/package.json
            generator/package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-patch-chain-validation
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

name: Validate Planning Patch Chain

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "patches/v0120-phase20/**"
      - "patches/v0120-phase21/**"
      - "patches/v0120-phase22/**"
      - "patches/v0120-phase23/**"
      - "patches/v0120-phase24/**"
      - "patches/v0120-phase25/**"
      - "patches/v0120-phase26/**"
      - "patches/v0120-phase27/**"
      - "patches/v0120-phase28/**"
      - "scripts/prefetch-planning-portal.mjs"
      - "scripts/prefetch-planning-portal-browser.mjs"
      - "scripts/prefetch-planning-portal-http.mjs"
      - "scripts/complete-planning-prefetch-attachments.mjs"
      - "scripts/complete-planning-prefetch-balanced.mjs"
      - "scripts/complete-planning-prefetch-balanced.impl.mjs.gz.b64.part-*"
      - "scripts/select-planning-prefetch.mjs"
      - "scripts/build-themepark-world-v0120-direct.sh.part-*"
      - ".github/workflows/build-themepark-world.yml"
      - ".github/workflows/validate-phase21-georeference.yml"
      - ".github/workflows/validate-phase26-prefetch.yml"

permissions:
  contents: read

concurrency:
  group: planning-patch-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-planning-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TPMAP_CONTACT: https://github.com/${{ github.repository }}
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_registry: https://registry.npmjs.org/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Install geospatial and automatic-registration tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin unzip poppler-utils curl wget ca-certificates python3-opencv
          python3 -c 'import cv2; print(cv2.__version__)'

      - name: Validate expanded planning prefetch client
        shell: bash
        run: |
          node scripts/prefetch-planning-portal-http.mjs --self-test
          node scripts/complete-planning-prefetch-attachments.mjs --self-test
          node scripts/complete-planning-prefetch-balanced.mjs --self-test
          node scripts/prefetch-planning-portal-browser.mjs --self-test
          node scripts/prefetch-planning-portal.mjs --self-test
          node scripts/select-planning-prefetch.mjs --self-test

      - name: Assemble validation runner
        shell: bash
        run: |
          cat scripts/build-themepark-world-v0120-direct.sh.part-* > "$RUNNER_TEMP/planning-chain-validation.sh"
          python3 - "$RUNNER_TEMP/planning-chain-validation.sh" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = '  node src/cli.mjs doctor 2>&1 | tee "$DIAG/doctor.log"\n)\n\nSOURCE_ARGS=('
          replacement = '  unset TPMAP_PLANNING_PREFETCH_DIR\n  node src/cli.mjs doctor 2>&1 | tee "$DIAG/doctor.log"\n)\n\necho "Planning patch-chain validation complete; world generation intentionally skipped."\nexit 0\n\nSOURCE_ARGS=('
          if marker not in text:
              raise SystemExit("Could not locate the post-compatibility validation boundary")
          path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY
          chmod +x "$RUNNER_TEMP/planning-chain-validation.sh"
          bash -n "$RUNNER_TEMP/planning-chain-validation.sh"

      - name: Apply Phase 20–28 chain and run tests
        shell: bash
        run: |
          TPMAP_PLANNING_PREFETCH_DIR="$RUNNER_TEMP/production-prefetch-sentinel" \
            bash "$RUNNER_TEMP/planning-chain-validation.sh"

      - name: Upload applied planning source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-applied-source
          path: |
            generator/src/**
            generator/test/**
            generator/examples/**
            generator/*.md
            generator/package.json
            generator/package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-patch-chain-validation
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

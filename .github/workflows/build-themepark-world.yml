name: Build Minecraft Theme Park World

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Park preset
        required: true
        default: chessington
        type: choice
        options:
          - chessington
          - custom
      park_name:
        description: Custom park name (custom preset only)
        required: false
        default: ""
        type: string
      bbox:
        description: Custom bounds as south,west,north,east
        required: false
        default: ""
        type: string
      quality:
        description: Data-source profile
        required: true
        default: maximum-public
        type: choice
        options:
          - maximum-public
          - open
          - osm-only
      source_failure_mode:
        description: Continue when an external provider is unavailable
        required: true
        default: continue
        type: choice
        options:
          - continue
          - fail
      world_margin:
        description: Extra generated terrain around the park, in blocks
        required: true
        default: "32"
        type: string

permissions:
  contents: read

concurrency:
  group: themepark-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    name: Generate Bedrock .mcworld
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_SOURCE_FAILURE_MODE: ${{ inputs.source_failure_mode }}
      TPMAP_OUT: out/github-actions
      NODE_OPTIONS: --max-old-space-size=6144
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand generator source bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="ThemePark_Map_v0.12.0_MultiSource_Source.zip"
          if [[ ! -f "$SOURCE_ZIP" ]]; then
            echo "Missing $SOURCE_ZIP in the repository root." >&2
            echo "Download the source ZIP supplied with this setup and upload it using Add file → Upload files." >&2
            exit 2
          fi
          mkdir -p generator
          unzip -q "$SOURCE_ZIP" -d generator
          test -f generator/package.json
          test -f generator/src/cli.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install native geospatial tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            zlib1g-dev libssl-dev \
            gdal-bin libgdal-dev \
            libsqlite3-dev jq zip unzip
          sudo apt-get install -y --no-install-recommends pdal libpdal-dev || true
          gdalinfo --version
          pdal --version || true

      - name: Install Overture downloader
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "overturemaps>=0.14,<1"
          overturemaps --help >/dev/null

      - name: Install Node dependencies
        working-directory: generator
        run: npm ci

      - name: Run generator tests
        working-directory: generator
        run: npm test

      - name: Resolve build parameters
        id: params
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.preset }}" in
            chessington)
              PARK_NAME="Chessington World of Adventures"
              BBOX="51.3458,-0.3228,51.3535,-0.3133"
              ;;
            custom)
              PARK_NAME="${{ inputs.park_name }}"
              BBOX="${{ inputs.bbox }}"
              if [[ -z "$PARK_NAME" || -z "$BBOX" ]]; then
                echo "Custom builds require both park_name and bbox." >&2
                exit 2
              fi
              ;;
          esac

          QUALITY="${{ inputs.quality }}"
          if [[ "$QUALITY" == "osm-only" ]]; then
            SOURCE_PROFILE="manual"
            EXTRA_SOURCE_FLAGS="--no-auto-overture --no-auto-microsoft-buildings --no-auto-ea-aerial --no-auto-openaerialmap"
          else
            SOURCE_PROFILE="$QUALITY"
            EXTRA_SOURCE_FLAGS=""
          fi

          SAFE_NAME="$(printf '%s' "$PARK_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          {
            echo "park_name=$PARK_NAME"
            echo "bbox=$BBOX"
            echo "source_profile=$SOURCE_PROFILE"
            echo "extra_source_flags=$EXTRA_SOURCE_FLAGS"
            echo "safe_name=$SAFE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Build pre-generated Minecraft world
        working-directory: generator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TPMAP_OUT"
          mkdir -p "$TPMAP_OUT"

          node src/cli.mjs build \
            --park-name "${{ steps.params.outputs.park_name }}" \
            --bbox "${{ steps.params.outputs.bbox }}" \
            --contact "$TPMAP_CONTACT" \
            --accept-nominatim-policy \
            --source-profile "${{ steps.params.outputs.source_profile }}" \
            --source-failure-mode "$TPMAP_SOURCE_FAILURE_MODE" \
            --overture-types "building,segment,infrastructure,land,land_cover,water,place" \
            --elevation ea-lidar \
            --orthophoto-mode evidence \
            --path-discovery-mode evidence \
            --path-terrain-mode conform \
            --terrain-detail-mode evidence \
            --buildings shells \
            --ride-profile-mode auto \
            --ride-terrain-mode inferred \
            --accuracy-mode verified \
            --palette realistic \
            --world-margin "${{ inputs.world_margin }}" \
            ${{ steps.params.outputs.extra_source_flags }} \
            --out "$TPMAP_OUT" 2>&1 | tee "$TPMAP_OUT/build.log"

          MCWORLD="$(find "$TPMAP_OUT" -maxdepth 1 -type f -name '*_1to1.mcworld' -print -quit)"
          if [[ -z "$MCWORLD" ]]; then
            echo "The generator finished without producing a .mcworld." >&2
            exit 3
          fi
          echo "MCWORLD=$MCWORLD" >> "$GITHUB_ENV"

      - name: Validate generated archive
        working-directory: generator
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$MCWORLD"
          GEOJSON="$(find "$TPMAP_OUT" -maxdepth 1 -type f -name '*.geojson' -print -quit)"
          node scripts/validate-world.mjs \
            --world "$MCWORLD" \
            --manifest "$TPMAP_OUT/world-manifest.json" \
            --labels "$TPMAP_OUT/building-labels.json" \
            --geojson "$GEOJSON" \
            --out "$TPMAP_OUT/independent-validation.json" \
            --markdown "$TPMAP_OUT/VALIDATION_REPORT.md"

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Theme Park World Build"
            echo
            echo "- Preset: \`${{ inputs.preset }}\`"
            echo "- Park: **${{ steps.params.outputs.park_name }}**"
            echo "- Bounds: \`${{ steps.params.outputs.bbox }}\`"
            echo "- Source profile: \`${{ inputs.quality }}\`"
            echo "- Provider failure policy: \`${{ inputs.source_failure_mode }}\`"
            echo
            if [[ -n "${MCWORLD:-}" && -f "generator/${MCWORLD:-}" ]]; then
              WORLD_PATH="generator/$MCWORLD"
              echo "## Output"
              echo
              echo "- File: \`$(basename "$WORLD_PATH")\`"
              echo "- Size: \`$(du -h "$WORLD_PATH" | cut -f1)\`"
              echo "- SHA-256: \`$(sha256sum "$WORLD_PATH" | cut -d' ' -f1)\`"
            else
              echo "The build did not produce a world. Download the diagnostic artifact and inspect the logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated world
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.safe_name }}-mcworld
          path: |
            generator/out/github-actions/*_1to1.mcworld
            generator/out/github-actions/ACCURACY_REPORT.md
            generator/out/github-actions/VALIDATION_REPORT.md
            generator/out/github-actions/independent-validation.json
            generator/out/github-actions/source-acquisition.json
            generator/out/github-actions/source-fusion.json
            generator/out/github-actions/evidence.json
            generator/out/github-actions/fidelity.json
            generator/out/github-actions/ride-profiles.json
            generator/out/github-actions/world-manifest.json
            generator/out/github-actions/build-result.json
            generator/out/github-actions/preview.svg
            generator/out/github-actions/preview.html
            generator/out/github-actions/build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-build-diagnostics
          path: |
            generator/out/github-actions/**
            generator/npm-debug.log*
          if-no-files-found: warn
          retention-days: 14

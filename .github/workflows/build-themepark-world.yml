name: Build Minecraft Theme Park World

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Park preset
        required: true
        default: alton-towers
        type: choice
        options: [alton-towers, chessington, custom]
      park_name:
        description: Custom park name
        required: false
        default: ""
        type: string
      bbox:
        description: Optional custom bounds as south,west,north,east
        required: false
        default: ""
        type: string
      accuracy:
        description: Reconstruction policy
        required: true
        default: benchmark
        type: choice
        options: [benchmark, verified]
      world_margin:
        description: Extra terrain around park, in blocks
        required: true
        default: "32"
        type: string
      orthophoto_url:
        description: Optional direct URL to georeferenced RGB GeoTIFF/COG
        required: false
        default: ""
        type: string
      orthophoto_source:
        description: Imagery provider or survey name
        required: false
        default: ""
        type: string
      orthophoto_license:
        description: Reuse licence
        required: false
        default: ""
        type: string
      orthophoto_date:
        description: Capture date YYYY-MM-DD
        required: false
        default: ""
        type: string
      orthophoto_sha256:
        description: Optional imagery SHA-256
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: themepark-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    name: Generate Bedrock .mcworld
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_OUT: out/github-actions
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p .ci-diagnostics

      - name: Resolve park settings
        id: params
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.preset }}" in
            alton-towers)
              PARK_NAME="Alton Towers Resort"
              BBOX="52.9810,-1.8970,52.9960,-1.8690"
              ;;
            chessington)
              PARK_NAME="Chessington World of Adventures"
              BBOX="51.3458,-0.3228,51.3535,-0.3133"
              ;;
            custom)
              PARK_NAME="${{ inputs.park_name }}"
              BBOX="${{ inputs.bbox }}"
              [[ -n "$PARK_NAME" && -n "$BBOX" ]] || { echo "Custom builds require park_name and bbox." >&2; exit 2; }
              ;;
            *) echo "Unknown preset: ${{ inputs.preset }}" >&2; exit 2 ;;
          esac

          case "${{ inputs.accuracy }}" in
            benchmark)
              ACCURACY_MODE="plausible"
              TERRAIN_DETAIL_MODE="plausible"
              ALLOW_SOURCE_FALLBACK="true"
              ;;
            verified)
              ACCURACY_MODE="verified"
              TERRAIN_DETAIL_MODE="evidence"
              ALLOW_SOURCE_FALLBACK="false"
              ;;
            *) echo "Unknown accuracy mode: ${{ inputs.accuracy }}" >&2; exit 2 ;;
          esac

          SAFE_NAME="$(printf '%s' "$PARK_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')"
          {
            echo "park_name=$PARK_NAME"
            echo "bbox=$BBOX"
            echo "accuracy_mode=$ACCURACY_MODE"
            echo "terrain_detail_mode=$TERRAIN_DETAIL_MODE"
            echo "allow_source_fallback=$ALLOW_SOURCE_FALLBACK"
            echo "safe_name=$SAFE_NAME"
          } >> "$GITHUB_OUTPUT"
          printf 'park=%s\nbbox=%s\naccuracy=%s\nfallback=%s\n' "$PARK_NAME" "$BBOX" "$ACCURACY_MODE" "$ALLOW_SOURCE_FALLBACK" \
            | tee .ci-diagnostics/resolved-parameters.txt

      - name: Expand verified v0.11.1 source bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="ThemePark_Map_v0.11.1_Aerial_Surface_Vegetation_Source.zip"
          EXPECTED_SHA256="cdc31ca95010458ed967c37f735a6fbf723cae230c97b85deb9a7ee620370ba6"
          [[ -f "$SOURCE_ZIP" ]] || { echo "Missing $SOURCE_ZIP" | tee .ci-diagnostics/source-error.txt >&2; exit 2; }
          ACTUAL_SHA256="$(sha256sum "$SOURCE_ZIP" | cut -d' ' -f1)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SHA256" "$ACTUAL_SHA256" | tee .ci-diagnostics/source-checksum.txt
          [[ "$ACTUAL_SHA256" == "$EXPECTED_SHA256" ]] || { echo "Source ZIP checksum mismatch." >&2; exit 2; }
          rm -rf generator
          mkdir -p generator
          unzip -q "$SOURCE_ZIP" -d generator
          test -f generator/package.json
          test -f generator/package-lock.json
          test -f generator/src/cli.mjs
          mkdir -p generator/out/github-actions

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install native tools
        shell: bash
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build pkg-config \
              zlib1g-dev libssl-dev libsqlite3-dev \
              gdal-bin libgdal-dev jq zip unzip curl xz-utils
            sudo apt-get install -y --no-install-recommends pdal libpdal-dev || true
            gdalinfo --version
            pdal --version || true
          } 2>&1 | tee .ci-diagnostics/native-tools.log

      - name: Install production Node dependencies
        working-directory: generator
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev --no-audit --no-fund 2>&1 | tee ../.ci-diagnostics/npm-ci.log

      - name: Run focused smoke tests
        working-directory: generator
        shell: bash
        run: |
          set -euo pipefail
          node --test test/appearance-vegetation.test.mjs 2>&1 | tee ../.ci-diagnostics/smoke-tests.log
          node src/cli.mjs doctor 2>&1 | tee ../.ci-diagnostics/doctor.log

      - name: Stage optional orthophoto evidence
        id: imagery
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ inputs.orthophoto_url }}"
          if [[ -z "$URL" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No orthophoto supplied." | tee .ci-diagnostics/orthophoto.txt
            exit 0
          fi
          SOURCE="${{ inputs.orthophoto_source }}"
          LICENSE="${{ inputs.orthophoto_license }}"
          [[ -n "$SOURCE" && -n "$LICENSE" ]] || { echo "Source and licence are required with orthophoto_url." >&2; exit 2; }
          mkdir -p generator/data
          curl --fail --location --retry 4 --retry-all-errors \
            --user-agent "ThemeParkMap/0.11.1 ($TPMAP_CONTACT)" \
            "$URL" -o generator/data/park-orthophoto.tif 2>&1 | tee .ci-diagnostics/orthophoto-download.log
          test -s generator/data/park-orthophoto.tif
          EXPECTED="${{ inputs.orthophoto_sha256 }}"
          if [[ -n "$EXPECTED" ]]; then
            ACTUAL="$(sha256sum generator/data/park-orthophoto.tif | cut -d' ' -f1)"
            [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "Orthophoto SHA-256 mismatch." >&2; exit 2; }
          fi
          gdalinfo generator/data/park-orthophoto.tif > .ci-diagnostics/orthophoto-gdalinfo.txt
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Build world with source fallbacks
        id: build
        working-directory: generator
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ../.ci-diagnostics
          PRIMARY_OVERPASS="https://overpass-api.de/api/interpreter"
          ALTERNATE_OVERPASS="https://overpass.kumi.systems/api/interpreter"

          build_attempt() {
            local label="$1"
            local elevation="$2"
            local overpass="$3"
            local dsm_mode="$4"
            local log="../.ci-diagnostics/build-${label}.log"
            echo "Starting strategy=$label elevation=$elevation overpass=$overpass dsm=$dsm_mode" | tee "$log"
            rm -rf "$TPMAP_OUT"
            mkdir -p "$TPMAP_OUT"

            ARGS=(
              build
              --park-name "${{ steps.params.outputs.park_name }}"
              --bbox "${{ steps.params.outputs.bbox }}"
              --contact "$TPMAP_CONTACT"
              --accept-nominatim-policy
              --overpass-url "$overpass"
              --elevation "$elevation"
              --buildings markers
              --path-terrain-mode conform
              --terrain-detail-mode "${{ steps.params.outputs.terrain_detail_mode }}"
              --tree-density-per-100m2 2.8
              --shrub-density-per-100m2 16
              --tree-line-spacing-m 3
              --vegetation-min-spacing-m 3
              --max-vegetation-models 30000
              --ride-profile-mode auto
              --ride-terrain-mode inferred
              --accuracy-mode "${{ steps.params.outputs.accuracy_mode }}"
              --palette realistic
              --world-margin "${{ inputs.world_margin }}"
              --allow-large-area
              --max-area-km2 12
              --max-cells 8000000
              --max-world-chunks 20000
              --no-addon
              --out "$TPMAP_OUT"
            )
            [[ "$dsm_mode" == "off" ]] && ARGS+=(--no-dsm)

            if [[ "${{ steps.imagery.outputs.enabled }}" == "true" ]]; then
              ARGS+=(
                --orthophoto data/park-orthophoto.tif
                --orthophoto-source "${{ inputs.orthophoto_source }}"
                --orthophoto-source-url "${{ inputs.orthophoto_url }}"
                --orthophoto-license "${{ inputs.orthophoto_license }}"
                --orthophoto-mode evidence
                --path-discovery-mode evidence
                --aerial-terrain-mode evidence
                --aerial-terrain-grid-m 2
                --aerial-terrain-min-confidence 0.72
              )
              [[ -n "${{ inputs.orthophoto_date }}" ]] && ARGS+=(--orthophoto-date "${{ inputs.orthophoto_date }}")
            else
              ARGS+=(--orthophoto-mode off --path-discovery-mode off --aerial-terrain-mode off)
            fi

            set +e
            node src/cli.mjs "${ARGS[@]}" 2>&1 | tee -a "$log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "exit_status=$status" | tee -a "$log"
            if [[ $status -ne 0 ]]; then
              return $status
            fi

            MCWORLD="$(find "$TPMAP_OUT" -maxdepth 1 -type f -name '*_1to1.mcworld' -print -quit)"
            [[ -n "$MCWORLD" ]] || return 3
            printf '{"strategy":"%s","elevation":"%s","overpass":"%s","dsm":"%s"}\n' \
              "$label" "$elevation" "$overpass" "$dsm_mode" > "$TPMAP_OUT/build-strategy.json"
            echo "MCWORLD=$MCWORLD" >> "$GITHUB_ENV"
            echo "mcworld=$MCWORLD" >> "$GITHUB_OUTPUT"
            echo "strategy=$label" >> "$GITHUB_OUTPUT"
            return 0
          }

          set -e
          if build_attempt "01-ea-full-primary" "ea-lidar" "$PRIMARY_OVERPASS" "on"; then exit 0; fi
          if [[ "${{ steps.params.outputs.allow_source_fallback }}" != "true" ]]; then
            echo "Verified mode does not permit evidence-source fallback." >&2
            exit 2
          fi
          if build_attempt "02-ea-dtm-primary" "ea-lidar" "$PRIMARY_OVERPASS" "off"; then exit 0; fi
          if build_attempt "03-ea-dtm-alternate" "ea-lidar" "$ALTERNATE_OVERPASS" "off"; then exit 0; fi
          if build_attempt "04-flat-alternate" "none" "$ALTERNATE_OVERPASS" "off"; then exit 0; fi
          echo "All build strategies failed." >&2
          exit 2

      - name: Validate Bedrock world archive
        if: ${{ steps.build.outputs.mcworld != '' }}
        working-directory: generator
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$MCWORLD"
          ARCHIVE_LIST="$(mktemp)"
          unzip -Z1 "$MCWORLD" > "$ARCHIVE_LIST"
          for REQUIRED_ENTRY in level.dat levelname.txt db/CURRENT; do
            grep -Fxq "$REQUIRED_ENTRY" "$ARCHIVE_LIST" || { echo "Missing $REQUIRED_ENTRY" >&2; exit 4; }
          done
          CURRENT_MANIFEST="$(unzip -p "$MCWORLD" db/CURRENT | tr -d '\r\n')"
          [[ -n "$CURRENT_MANIFEST" ]] || { echo "db/CURRENT is empty." >&2; exit 4; }
          grep -Fxq "db/$CURRENT_MANIFEST" "$ARCHIVE_LIST" || { echo "Missing LevelDB manifest $CURRENT_MANIFEST" >&2; exit 4; }
          WORLD_BYTES="$(stat -c '%s' "$MCWORLD")"
          WORLD_SHA256="$(sha256sum "$MCWORLD" | cut -d' ' -f1)"
          ARCHIVE_ENTRIES="$(wc -l < "$ARCHIVE_LIST" | tr -d ' ')"
          DATABASE_ENTRIES="$(grep -c '^db/' "$ARCHIVE_LIST" || true)"
          LEVEL_NAME="$(unzip -p "$MCWORLD" levelname.txt | tr -d '\r\n')"
          jq -n --arg status passed --arg filename "$(basename "$MCWORLD")" \
            --arg levelName "$LEVEL_NAME" --arg sha256 "$WORLD_SHA256" \
            --arg manifest "$CURRENT_MANIFEST" --arg strategy "${{ steps.build.outputs.strategy }}" \
            --argjson bytes "$WORLD_BYTES" --argjson archiveEntries "$ARCHIVE_ENTRIES" \
            --argjson databaseEntries "$DATABASE_ENTRIES" \
            '{schemaVersion:2,status:$status,strategy:$strategy,world:{filename:$filename,levelName:$levelName,bytes:$bytes,sha256:$sha256,archiveEntries:$archiveEntries},leveldb:{currentManifest:$manifest,databaseEntries:$databaseEntries,status:"present"}}' \
            > "$TPMAP_OUT/independent-validation.json"

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Theme Park World Build"
            echo
            echo "- Park: **${{ steps.params.outputs.park_name || 'Not resolved' }}**"
            echo "- Bounds: \`${{ steps.params.outputs.bbox || 'Not resolved' }}\`"
            echo "- Accuracy: \`${{ inputs.accuracy }}\`"
            echo "- Orthophoto enabled: \`${{ steps.imagery.outputs.enabled || 'false' }}\`"
            echo "- Successful source strategy: \`${{ steps.build.outputs.strategy || 'none' }}\`"
            if [[ -n "${MCWORLD:-}" && -f "generator/${MCWORLD:-}" ]]; then
              WORLD_PATH="generator/$MCWORLD"
              echo "- File: \`$(basename "$WORLD_PATH")\`"
              echo "- Size: \`$(du -h "$WORLD_PATH" | cut -f1)\`"
              echo "- SHA-256: \`$(sha256sum "$WORLD_PATH" | cut -d' ' -f1)\`"
            else
              echo
              echo "No world was produced. Download the diagnostics artifact for every attempted source strategy."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated world and reports
        if: ${{ always() && steps.build.outputs.mcworld != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.safe_name }}-mcworld
          path: generator/out/github-actions/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-build-diagnostics
          path: |
            .ci-diagnostics/**
            generator/out/github-actions/build.log
            generator/npm-debug.log*
          if-no-files-found: warn
          retention-days: 14

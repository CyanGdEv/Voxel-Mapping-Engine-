name: Build Minecraft Theme Park World

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select the theme park to generate
        required: true
        default: alton-towers
        type: choice
        options:
          - alton-towers
          - chessington
          - thorpe-park

permissions:
  contents: read

concurrency:
  group: themepark-world-${{ github.ref }}-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  planning-prefetch:
    name: Planning discovery (${{ matrix.label }})
    if: ${{ inputs.preset == 'alton-towers' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-gnutls
          - os: windows-2025
            label: windows-schannel
          - os: macos-15
            label: macos-native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux planning transport dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget ca-certificates

      - name: Validate expanded planning client
        shell: bash
        run: |
          node scripts/prefetch-planning-portal-http.mjs --self-test
          node scripts/complete-planning-prefetch-attachments.mjs --self-test
          node scripts/complete-planning-prefetch-balanced.mjs --self-test
          node scripts/prefetch-planning-portal-browser.mjs --self-test
          node scripts/prefetch-planning-portal.mjs --self-test

      - name: Discover and download official planning evidence
        continue-on-error: true
        shell: bash
        run: |
          node scripts/prefetch-planning-portal-browser.mjs \
            --output planning-prefetch-output \
            --runner "${{ matrix.label }}-expanded" \
            --max-applications 300 \
            --max-documents 1200 \
            --max-mb 150 || true
          node -e "const m=require('./planning-prefetch-output/manifest.json'); process.exit(m.status === 'usable' ? 0 : 1)" || \
            node scripts/prefetch-planning-portal.mjs \
              --output planning-prefetch-output \
              --runner "${{ matrix.label }}" \
              --max-applications 300 \
              --max-documents 1200 \
              --max-mb 150

      - name: Upload platform planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-prefetch-${{ matrix.label }}
          path: planning-prefetch-output/**
          if-no-files-found: warn
          retention-days: 2

  select-planning-prefetch:
    name: Select strongest verified planning evidence
    if: always()
    needs: planning-prefetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download platform candidates
        if: ${{ inputs.preset == 'alton-towers' }}
        uses: actions/download-artifact@v4
        with:
          pattern: planning-prefetch-*
          path: planning-prefetch-candidates
          merge-multiple: false

      - name: Validate selector
        run: node scripts/select-planning-prefetch.mjs --self-test

      - name: Select strongest usable artifact
        shell: bash
        run: |
          required=false
          if [[ "${{ inputs.preset }}" == "alton-towers" ]]; then
            required=true
          fi
          node scripts/select-planning-prefetch.mjs \
            --input planning-prefetch-candidates \
            --output planning-prefetch-selected \
            --required "$required"

      - name: Write planning evidence summary
        if: always()
        shell: bash
        run: |
          if [[ -f planning-prefetch-selected/manifest.json ]]; then
            node - <<'NODE'
            const manifest = require('./planning-prefetch-selected/manifest.json');
            const represented = (manifest.applications || []).filter((app) => (app.downloadedDocuments || []).length > 0).length;
            console.log(JSON.stringify({
              status: manifest.status,
              runner: manifest.runner,
              liveApplications: manifest.liveApplications || 0,
              documentsDownloaded: manifest.documentsDownloaded || 0,
              representedApplications: represented,
              totalBytes: manifest.totalBytes || 0
            }, null, 2));
            NODE
          fi

      - name: Upload selected planning evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: planning-prefetch-selected
          path: planning-prefetch-selected/**
          if-no-files-found: error
          retention-days: 2

      - name: Upload planning selection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planning-prefetch-selection-diagnostics
          path: planning-prefetch-selected/**
          if-no-files-found: warn
          retention-days: 14

  build-world:
    name: Generate automatic Bedrock world
    needs: select-planning-prefetch
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_PRESET: ${{ inputs.preset }}
      TPMAP_PARK_NAME: ""
      TPMAP_BBOX: ""
      TPMAP_ACCURACY: benchmark
      TPMAP_WORLD_MARGIN: "32"
      TPMAP_ENGLAND_OPEN_DATA: "true"
      TPMAP_PLANNING_DOCUMENT_MODE: extract
      TPMAP_PLANNING_DOCUMENT_MAX_APPLICATIONS: "300"
      TPMAP_PLANNING_DOCUMENT_MAX_DOCUMENTS: "1200"
      TPMAP_PLANNING_DOCUMENT_MAX_MB: "150"
      TPMAP_PLANNING_DOCUMENT_MAX_PAGES: "12"
      TPMAP_PLANNING_DOCUMENT_MIN_SCORE: "25"
      TPMAP_PLANNING_DOCUMENT_LICENSE: ""
      TPMAP_PLANNING_PREFETCH_DIR: ${{ github.workspace }}/planning-prefetch-selected
      TPMAP_PLANNING_OVERRIDE_MODE: gated
      TPMAP_PLANNING_GEOMETRY_PATH: ""
      TPMAP_PLANNING_OVERRIDE_MIN_CONFIDENCE: "0.86"
      TPMAP_PLANNING_OVERRIDE_MIN_OVERLAP: "0.18"
      TPMAP_PLANNING_OVERRIDE_MAX_OFFSET_M: "25"
      TPMAP_MICROSOFT_BUILDINGS: "true"
      TPMAP_WIKIDATA_PLACES: "true"
      TPMAP_WIKIMEDIA_COMMONS: "false"
      TPMAP_OPEN_AERIAL_MAP: "true"
      TPMAP_STRICT_SUPPLEMENTAL_SOURCES: "false"
      TPMAP_SOURCE_CONFIG_PATH: ""
      TPMAP_OS_OPENMAP_LOCAL_PATH: ""
      TPMAP_ORTHOPHOTO_URL: ""
      TPMAP_ORTHOPHOTO_SOURCE: ""
      TPMAP_ORTHOPHOTO_LICENSE: ""
      TPMAP_ORTHOPHOTO_DATE: ""
      TPMAP_ORTHOPHOTO_SHA256: ""
      TPMAP_MAX_SUPPLEMENTAL_FEATURES: "50000"
      TPMAP_SUPPLEMENTAL_PAGE_SIZE: "5000"
      TPMAP_MAX_SUPPLEMENTAL_DOWNLOAD_MB: "250"
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"
      npm_config_registry: "https://registry.npmjs.org/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download selected planning evidence
        uses: actions/download-artifact@v4
        with:
          name: planning-prefetch-selected
          path: planning-prefetch-selected

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install geospatial and automatic-registration tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin unzip poppler-utils python3-opencv
          python3 -c 'import cv2; print(cv2.__version__)'

      - name: Generate and validate world
        id: build
        shell: bash
        run: |
          cat scripts/build-themepark-world-v0120-direct.sh.part-* > "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          chmod +x "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"
          bash "$RUNNER_TEMP/build-themepark-world-v0120-direct.sh"

      - name: Write build summary
        if: always()
        shell: bash
        env:
          SUMMARY_PRESET: ${{ inputs.preset }}
          SUMMARY_STRATEGY: ${{ steps.build.outputs.strategy || 'none' }}
        run: |
          {
            printf '%s\n' '# Voxel Mapping Engine — Automatic Theme Park World'
            printf '\n'
            printf '%s\n' "- Park: ${SUMMARY_PRESET:-unknown}"
            printf '%s\n' '- Player inputs: park selection only'
            printf '%s\n' '- Accuracy profile: benchmark'
            printf '%s\n' "- Successful strategy: ${SUMMARY_STRATEGY:-none}"
            printf '%s\n' '- Planning workflow: expanded discovery, balanced acquisition, automatic registration, vector extraction and gated fusion'
            if [[ -f "$TPMAP_PLANNING_PREFETCH_DIR/manifest.json" ]]; then
              node -e 'const m=require(process.argv[1]); const r=(m.applications||[]).filter(a=>(a.downloadedDocuments||[]).length).length; console.log(`- Planning evidence: ${m.liveApplications||0} applications, ${m.documentsDownloaded||0} documents, ${r} represented applications, runner ${m.runner||"unknown"}`)' "$TPMAP_PLANNING_PREFETCH_DIR/manifest.json"
            fi
            if [[ -n "${MCWORLD:-}" && -f "$MCWORLD" ]]; then
              printf '\n%s\n' '## Generated world'
              printf '%s\n' "- File: $(basename "$MCWORLD")"
              printf '%s\n' "- Size: $(du -h "$MCWORLD" | cut -f1)"
              printf '%s\n' "- SHA-256: $(sha256sum "$MCWORLD" | cut -d' ' -f1)"
              printf '%s\n' '- Download the artifact, unzip it in the iOS Files app, then tap the .mcworld file.'
            else
              printf '\n%s\n' '## Failure details'
              for LOG in ci-diagnostics/fatal-error.log ci-diagnostics/source-error.txt ci-diagnostics/source-checksum.txt ci-diagnostics/source-archive-validation.log ci-diagnostics/source-syntax-check.log ci-diagnostics/version-check.log ci-diagnostics/npm-ci.log ci-diagnostics/compatibility-tests.log ci-diagnostics/doctor.log ci-diagnostics/orthophoto-download.log ci-diagnostics/planning-authority-config.txt ci-diagnostics/planning-document-config.txt ci-diagnostics/phase2*-* ci-diagnostics/build-*.log; do
                [[ -f "$LOG" ]] || continue
                printf '\n<details><summary>%s</summary>\n\n' "$(basename "$LOG")"
                printf '%s\n' '```text'
                tail -n 180 "$LOG"
                printf '%s\n' '```'
                printf '%s\n' '</details>'
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated world and reports
        if: ${{ always() && steps.build.outputs.mcworld != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.safe_name }}-mcworld-v0120
          path: generator/out/github-actions/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-v0120-build-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

name: Build Minecraft Theme Park World

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Park preset
        required: true
        default: alton-towers
        type: choice
        options: [alton-towers, chessington, custom]
      park_name:
        description: Custom park name
        required: false
        default: ""
        type: string
      bbox:
        description: Custom bounds as south,west,north,east
        required: false
        default: ""
        type: string
      accuracy:
        description: Reconstruction policy
        required: true
        default: benchmark
        type: choice
        options: [benchmark, verified]
      world_margin:
        description: Extra terrain around park, in blocks
        required: true
        default: "32"
        type: string
      orthophoto_url:
        description: Optional georeferenced RGB GeoTIFF or COG URL
        required: false
        default: ""
        type: string
      orthophoto_source:
        description: Imagery provider or survey name
        required: false
        default: ""
        type: string
      orthophoto_license:
        description: Reuse licence
        required: false
        default: ""
        type: string
      orthophoto_date:
        description: Capture date YYYY-MM-DD
        required: false
        default: ""
        type: string
      orthophoto_sha256:
        description: Optional imagery SHA-256
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: themepark-world-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-world:
    name: Generate Bedrock .mcworld
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TPMAP_CONTACT: ${{ vars.TPMAP_CONTACT || format('https://github.com/{0}', github.repository) }}
      TPMAP_PRESET: ${{ inputs.preset }}
      TPMAP_PARK_NAME: ${{ inputs.park_name }}
      TPMAP_BBOX: ${{ inputs.bbox }}
      TPMAP_ACCURACY: ${{ inputs.accuracy }}
      TPMAP_WORLD_MARGIN: ${{ inputs.world_margin }}
      TPMAP_ORTHOPHOTO_URL: ${{ inputs.orthophoto_url }}
      TPMAP_ORTHOPHOTO_SOURCE: ${{ inputs.orthophoto_source }}
      TPMAP_ORTHOPHOTO_LICENSE: ${{ inputs.orthophoto_license }}
      TPMAP_ORTHOPHOTO_DATE: ${{ inputs.orthophoto_date }}
      TPMAP_ORTHOPHOTO_SHA256: ${{ inputs.orthophoto_sha256 }}
      NODE_OPTIONS: --max-old-space-size=6144
      npm_config_audit: "false"
      npm_config_fund: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate and validate world
        id: build
        shell: bash
        run: bash scripts/build-themepark-world-v0115-direct.sh

      - name: Write build summary
        if: always()
        shell: bash
        env:
          SUMMARY_PRESET: ${{ inputs.preset }}
          SUMMARY_ACCURACY: ${{ inputs.accuracy }}
          SUMMARY_STRATEGY: ${{ steps.build.outputs.strategy || 'none' }}
          SUMMARY_ORTHOPHOTO: ${{ inputs.orthophoto_url != '' }}
        run: |
          {
            printf '%s\n' '# Theme Park World Build'
            printf '\n'
            printf '%s\n' '- Generator: v0.11.5 Path Phase 2B'
            printf '%s\n' '- Source package: checksum-verified v0.11.3 + v0.11.4 + v0.11.5 transformations'
            printf '%s\n' "- Park preset: ${SUMMARY_PRESET:-unknown}"
            printf '%s\n' "- Accuracy: ${SUMMARY_ACCURACY:-unknown}"
            if [[ "${SUMMARY_ACCURACY:-benchmark}" == verified ]]; then
              printf '%s\n' '- Path geometry: QA-only, no inferred connectors'
            else
              printf '%s\n' '- Path geometry: conservative repair, 3 m / 0.70 threshold'
            fi
            printf '%s\n' "- Orthophoto supplied: ${SUMMARY_ORTHOPHOTO:-false}"
            if [[ "${SUMMARY_ORTHOPHOTO:-false}" == true ]]; then
              printf '%s\n' '- Whole-park discovery: enabled for independently visible paths and plazas'
              printf '%s\n' '- Surface appearance: measured component RGB mapped to Minecraft palettes'
            else
              printf '%s\n' '- Whole-park discovery: inactive; no imagery source was supplied'
            fi
            printf '%s\n' '- Path surface painting: replace natural top layer, preserve DTM elevation'
            printf '%s\n' '- Final path edges: clean render; confidence boundaries remain in QA reports only'
            printf '%s\n' "- Successful source strategy: ${SUMMARY_STRATEGY:-none}"
            if [[ -n "${MCWORLD:-}" && -f "$MCWORLD" ]]; then
              printf '%s\n' "- File: $(basename "$MCWORLD")"
              printf '%s\n' "- Size: $(du -h "$MCWORLD" | cut -f1)"
              printf '%s\n' "- SHA-256: $(sha256sum "$MCWORLD" | cut -d' ' -f1)"
            else
              printf '\n%s\n' '## Failure details'
              FOUND_LOG=false
              for LOG in ci-diagnostics/build-*.log; do
                [[ -f "$LOG" ]] || continue
                FOUND_LOG=true
                printf '\n<details><summary>%s</summary>\n\n' "$(basename "$LOG")"
                printf '%s\n' '```text'
                tail -n 60 "$LOG"
                printf '%s\n' '```'
                printf '%s\n' '</details>'
              done
              if [[ "$FOUND_LOG" != true ]]; then
                for LOG in \
                  ci-diagnostics/fatal-error.log \
                  ci-diagnostics/v0114-source-patch.log \
                  ci-diagnostics/v0115-source-patch.log \
                  ci-diagnostics/source-syntax-check.log \
                  ci-diagnostics/doctor.log \
                  ci-diagnostics/compatibility-tests.log \
                  ci-diagnostics/npm-ci.log; do
                  [[ -f "$LOG" ]] || continue
                  printf '\n<details><summary>%s</summary>\n\n' "$(basename "$LOG")"
                  printf '%s\n' '```text'
                  tail -n 80 "$LOG"
                  printf '%s\n' '```'
                  printf '%s\n' '</details>'
                done
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated world and reports
        if: ${{ always() && steps.build.outputs.mcworld != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.safe_name }}-mcworld
          path: generator/out/github-actions/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: themepark-build-diagnostics
          path: ci-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

name: Validate Phase 29H Exact World Result Cache

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/exact-world-result-cache.mjs"
      - "scripts/validate-park-runtime-cache.mjs"
      - "scripts/validate-planning-evidence-cache.mjs"
      - ".github/workflows/validate-phase29h-exact-world-cache.yml"

permissions:
  contents: read

concurrency:
  group: phase29h-exact-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-exact-world-cache:
    name: Validate exact evidence/world cache integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate cache integrity helpers
        shell: bash
        run: |
          node scripts/validate-park-runtime-cache.mjs --self-test
          node scripts/validate-planning-evidence-cache.mjs --self-test
          node scripts/exact-world-result-cache.mjs --self-test

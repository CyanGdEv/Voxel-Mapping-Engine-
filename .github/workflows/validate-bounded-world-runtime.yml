name: Validate Bounded World Runtime

on:
  pull_request:
    paths:
      - '.github/workflows/build-themepark-world-resilient.yml'
      - 'patches/v0120-phase30/bedrock-palette-compatibility.mjs'
      - 'scripts/prepare-surface-material-hook.mjs'
      - 'scripts/install-phase30a-authority.mjs'
      - 'scripts/install-phase30a-tests.mjs'
      - 'scripts/build-themepark-world-v0120-direct.sh.part-*'
      - '.github/workflows/validate-bounded-world-runtime.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-themepark-world-resilient.yml'
      - 'patches/v0120-phase30/bedrock-palette-compatibility.mjs'
      - 'scripts/prepare-surface-material-hook.mjs'
      - 'scripts/install-phase30a-authority.mjs'
      - 'scripts/install-phase30a-tests.mjs'
      - 'scripts/build-themepark-world-v0120-direct.sh.part-*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Phase 30 compatibility transforms
        run: |
          node patches/v0120-phase30/bedrock-palette-compatibility.mjs --self-test
          node scripts/prepare-surface-material-hook.mjs --self-test
          node scripts/install-phase30a-authority.mjs --self-test
          node scripts/install-phase30a-tests.mjs --self-test
      - name: Validate concatenated direct runner syntax and ordering
        shell: bash
        run: |
          mapfile -t parts < <(printf '%s\n' scripts/build-themepark-world-v0120-direct.sh.part-* | sort)
          printf '%s\n' "${parts[@]}" | tee "$RUNNER_TEMP/part-order.txt"
          cat "${parts[@]}" > "$RUNNER_TEMP/direct-runner.sh"
          bash -n "$RUNNER_TEMP/direct-runner.sh"

          grep -q 'TPMAP_WORLD_RUN_BUDGET_SECONDS' "$RUNNER_TEMP/direct-runner.sh"
          grep -q 'deterministic-build-failure.marker' "$RUNNER_TEMP/direct-runner.sh"
          grep -q 'TPMAP_ATTEMPT_PREPARED=true' "$RUNNER_TEMP/direct-runner.sh"
          grep -q 'prepared-generator-integrity.log' "$RUNNER_TEMP/direct-runner.sh"
          grep -q 'PHASE30_SCENERY_BLOCK_LIBRARY_V2' "$RUNNER_TEMP/direct-runner.sh"
          grep -q 'Phase 30 current-semantics integration preflight passed' "$RUNNER_TEMP/direct-runner.sh"
          ! grep -q 'skipping redundant production test invocation' "$RUNNER_TEMP/direct-runner.sh"

          test ! -e scripts/build-themepark-world-v0120-direct.sh.part-02zzz-fast-attempt-guard-close
          test ! -e scripts/build-themepark-world-v0120-direct.sh.part-02za-phase30a-repair
          test -e scripts/build-themepark-world-v0120-direct.sh.part-02y-phase30a-authority
          test -e scripts/build-themepark-world-v0120-direct.sh.part-02zzzzzzzzzz-fast-attempt-guard-close

          phase30a_line=$(grep -n 'part-02y-phase30a-authority' "$RUNNER_TEMP/part-order.txt" | cut -d: -f1)
          legacy_phase30_line=$(grep -n 'part-02z-phase30$' "$RUNNER_TEMP/part-order.txt" | cut -d: -f1)
          phase30b_line=$(grep -n 'part-02zz-phase30b$' "$RUNNER_TEMP/part-order.txt" | cut -d: -f1)
          final_guard_line=$(grep -n 'part-02zzzzzzzzzz-fast-attempt-guard-close' "$RUNNER_TEMP/part-order.txt" | cut -d: -f1)
          test "$phase30a_line" -lt "$legacy_phase30_line"
          test "$legacy_phase30_line" -lt "$phase30b_line"
          test "$phase30b_line" -lt "$final_guard_line"

          # Phase 30D was merged into the stacked Phase 30C feature branch, not
          # current main. If it is promoted into main later, the final guard must
          # remain after it; until then do not require a nonexistent fragment.
          if grep -q 'part-02zzzz-phase30d$' "$RUNNER_TEMP/part-order.txt"; then
            phase30d_line=$(grep -n 'part-02zzzz-phase30d$' "$RUNNER_TEMP/part-order.txt" | cut -d: -f1)
            test "$phase30b_line" -lt "$phase30d_line"
            test "$phase30d_line" -lt "$final_guard_line"
          fi
      - name: Verify resilient workflow budget policy
        shell: bash
        run: |
          grep -q 'timeout-minutes: 40' .github/workflows/build-themepark-world-resilient.yml
          grep -q 'TPMAP_WORLD_RUN_BUDGET_SECONDS: "2040"' .github/workflows/build-themepark-world-resilient.yml
          grep -q 'timeout --signal=TERM --kill-after=20s 4m' .github/workflows/build-themepark-world-resilient.yml
          ! grep -q 'trying five-minute legacy fallback' .github/workflows/build-themepark-world-resilient.yml
